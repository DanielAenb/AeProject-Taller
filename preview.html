<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vista previa de redes · Ae Project .studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css" />
<link rel="stylesheet" href="assets/preview.css" />
</head>

<body>

<header class="app-header">
  <a href="index.html" class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">Ae Project</span>
    <span class="brand-tld">.studio</span>
  </a>
  <span class="tool-name">Vista previa de redes</span>
  <div class="spacer"></div>

  <div class="actions">
    <button class="btn btn-ghost btn-sm" id="btnAddImgs" title="Añadir imágenes">
      <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <span class="label-hide">Añadir</span>
    </button>
    <button class="btn btn-ghost btn-sm" id="btnExportPNG" title="Exportar PNG">
      <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
      <span class="label-hide">PNG</span>
    </button>
    <button class="btn btn-primary btn-sm" id="btnPrint" title="Imprimir / PDF">
      <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      PDF
    </button>

    <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
      <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </div>
</header>

<main class="pv-main">

  <!-- Columna izquierda · Biblioteca -->
  <aside class="pv-side pv-side-left">
    <div class="section">
      <div class="section-head">
        <span class="sh-title">Biblioteca</span>
        <div class="spacer"></div>
        <span class="sh-count" id="imgCount">0</span>
      </div>

      <div class="lib-drop" id="dropZone">
        <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <div class="ld-title">Arrastra imágenes aquí</div>
        <div class="ld-desc">o</div>
        <button class="btn btn-secondary btn-sm" id="btnAddImgs2">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Seleccionar archivos
        </button>
      </div>

      <div class="lib-list" id="libList"></div>

      <div class="lib-actions">
        <button class="btn btn-ghost btn-sm" id="btnToggleAll">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Mostrar/ocultar
        </button>
        <button class="btn btn-ghost btn-sm" id="btnClearImgs" style="color:var(--danger)">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          Vaciar
        </button>
      </div>
    </div>
  </aside>

  <!-- Columna central · Mockup -->
  <div class="pv-center">
    <div class="mockup-tabs">
      <button class="mockup-tab active" data-mockup="instagram">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/></svg>
        Instagram
      </button>
      <button class="mockup-tab" data-mockup="tiktok">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/></svg>
        TikTok
      </button>
      <button class="mockup-tab" data-mockup="facebook">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
        Facebook
      </button>

      <div class="spacer"></div>

      <button class="btn btn-ghost btn-sm" id="btnMockupTheme" title="Cambiar tema del mockup">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2v20" opacity="0.4"/></svg>
        <span id="mockupThemeLabel">Claro</span>
      </button>
    </div>

    <div class="mockup-stage">
      <div class="mockup-frame" id="mockupFrame"></div>
    </div>
  </div>

  <!-- Columna derecha · Ajustes -->
  <aside class="pv-side pv-side-right">
    <div class="section">
      <div class="section-head">
        <span class="sh-title">Perfil</span>
      </div>
      <div class="section-body">

        <div class="profile-row">
          <label class="profile-avatar-upload" title="Cambiar foto de perfil">
            <div class="profile-avatar" id="profileAvatarPreview">A</div>
            <input type="file" id="profileAvatarInput" accept="image/*" hidden />
            <span class="profile-avatar-edit">
              <svg class="icon" style="width:12px;height:12px" viewBox="0 0 24 24"><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </span>
          </label>
          <div style="flex:1;min-width:0">
            <div class="field" style="margin-bottom:6px">
              <input class="input" id="profileName" placeholder="Nombre a mostrar" style="font-size:13px;height:30px" />
            </div>
            <div class="field">
              <input class="input" id="profileUser" placeholder="@usuario" style="font-size:13px;height:30px" />
            </div>
          </div>
        </div>

        <div class="field" style="margin-top:12px">
          <label class="field-label">Bio</label>
          <textarea class="input" id="profileBio" rows="2" style="height:auto;min-height:44px;padding:8px 10px;resize:none;font-size:12.5px" placeholder="Diseño · Contenido"></textarea>
        </div>

        <div class="stats-fields">
          <div class="field">
            <label class="field-label">Publicaciones</label>
            <input class="input" id="profilePosts" style="font-size:13px;height:30px" />
          </div>
          <div class="field">
            <label class="field-label">Seguidores</label>
            <input class="input" id="profileFollowers" style="font-size:13px;height:30px" />
          </div>
          <div class="field">
            <label class="field-label">Siguiendo</label>
            <input class="input" id="profileFollowing" style="font-size:13px;height:30px" />
          </div>
        </div>

        <button class="btn btn-ghost btn-sm" id="btnResetProfile" style="width:100%;margin-top:8px">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
          Restaurar por defecto
        </button>

      </div>
    </div>

    <div class="section" id="layoutSection">
      <div class="section-head">
        <span class="sh-title">Diseño</span>
      </div>
      <div class="section-body">
        <div class="field" id="rowsField">
          <label class="field-label">Filas visibles</label>
          <div class="chips-row" id="gridRows"></div>
        </div>
        <div class="field" style="margin-top:10px">
          <label class="field-label">Tamaño del mockup</label>
          <div class="chips-row" id="gridSize"></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <span class="sh-title">Información</span>
      </div>
      <div class="section-body" style="font-size:12.5px;color:var(--text-muted);line-height:1.6">
        Arrastra las imágenes en la biblioteca para reordenarlas. La primera imagen es la más reciente.
        <div style="margin-top:8px;color:var(--text-subtle);font-size:11.5px">Las imágenes se guardan en tu navegador. No se suben a ningún servidor.</div>
      </div>
    </div>
  </aside>

</main>

<input type="file" id="fileInput" accept="image/*" multiple hidden />
<div class="toast-host" id="toastHost"></div>

<script src="assets/utils.js"></script>
<script src="assets/preview.js"></script>

</body>
</html>
